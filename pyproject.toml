[project]
name = "social-caster"
version = "0.1.0"
description = "Buffer-based Instagram and X scheduled posting service"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy==1.17.1",
    "pre-commit==4.2.0",
    "pytest==8.4.1",
    "ruff==0.12.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["NewAITees"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
exclude = "(^|/)NewAITees/"
